<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="pingGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  <rect x="18" y="18" width="476" height="476" rx="106" ry="106" fill="none" stroke="#60a5fa" stroke-width="3" stroke-opacity="0.3" />

  <!-- Center Vehicle & 360 Orbit Group (Scaled from 24x24) -->
  <g transform="translate(88, 96) scale(14.2)" stroke-linecap="round" stroke-linejoin="round">
    <!-- 360 Fleet Compass Orbit Ring -->
    <path d="M5 6.5A8 8 0 0 1 19 6.5" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="2 1.5" />

    <!-- Commercial Vehicle Truck Body -->
    <path d="M3 13h2l2-4h7l2 4h4v3H3v-3z" fill="none" stroke="#ffffff" stroke-width="2" />
    <path d="M14 9l1.5 4H19" fill="none" stroke="#ffffff" stroke-width="2" />

    <!-- Heavy-Duty Fleet Wheels -->
    <circle cx="7" cy="17" r="2" fill="#0f172a" stroke="#ffffff" stroke-width="2" />
    <circle cx="17" cy="17" r="2" fill="#0f172a" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Live Fleet Active Ping Pulse Indicator -->
  <circle cx="415" cy="95" r="42" fill="url(#pingGlow)" />
  <circle cx="415" cy="95" r="18" fill="#10b981" stroke="#ecfdf5" stroke-width="4" />
</svg>